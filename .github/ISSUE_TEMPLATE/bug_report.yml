name: Bug report
description: Report a reproducible defect without private or security-sensitive data.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, subscriber data, inbound email, provider payloads, or vulnerability details. Security reports follow SECURITY.md.
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit SHA where the problem occurs.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal provider-free steps and sanitized sample data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include sanitized output only.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node 24.19.0, and npm 11.19.0 details.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, personal data, private mail, and provider payloads.
          required: true
        - label: This is not a vulnerability report.
          required: true
